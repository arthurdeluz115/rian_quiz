<style>
  :root {
    --bg: #050505;
    --green: #3DF5A0;
    --green-dark: #16c47a;
    --green-glow: rgba(61, 245, 160, 0.35);
    --white: #f5f5f5;
    --muted: #a3a3a3;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  html, body {
    min-height: 100%;
    background: var(--bg);
    color: var(--white);
    font-family: 'Inter', system-ui, -apple-system, sans-serif;
    -webkit-font-smoothing: antialiased;
  }

  /* ---------- Fundo estilizado ---------- */
  .bg {
    position: fixed;
    inset: 0;
    z-index: 0;
    overflow: hidden;
    pointer-events: none;
  }
  .bg::before {
    /* grade sutil */
    content: "";
    position: absolute;
    inset: 0;
    background-image:
      linear-gradient(rgba(61,245,160,0.05) 1px, transparent 1px),
      linear-gradient(90deg, rgba(61,245,160,0.05) 1px, transparent 1px);
    background-size: 44px 44px;
    mask-image: radial-gradient(ellipse at 50% 35%, #000 20%, transparent 75%);
    -webkit-mask-image: radial-gradient(ellipse at 50% 35%, #000 20%, transparent 75%);
  }
  .glow {
    position: absolute;
    border-radius: 50%;
    filter: blur(90px);
  }
  .glow-1 {
    width: 520px; height: 520px;
    top: -180px; left: 50%;
    transform: translateX(-50%);
    background: rgba(61, 245, 160, 0.18);
  }
  .glow-2 {
    width: 380px; height: 380px;
    bottom: -160px; right: -120px;
    background: rgba(22, 196, 122, 0.14);
  }
  .glow-3 {
    width: 300px; height: 300px;
    bottom: 10%; left: -140px;
    background: rgba(61, 245, 160, 0.08);
  }
  .dot {
    position: absolute;
    width: 10px; height: 10px;
    border-radius: 50%;
    background: var(--green);
    box-shadow: 0 0 14px var(--green);
    animation: float 6s ease-in-out infinite;
  }
  .dot.d1 { top: 2%;  left: 11%; }
  .dot.d2 { top: 8%;  left: 8%;  width: 8px; height: 8px; animation-delay: 1.5s; }
  .dot.d3 { top: 22%; right: 9%; width: 6px; height: 6px; animation-delay: 3s; opacity: .7; }
  .dot.d4 { bottom: 14%; right: 14%; width: 7px; height: 7px; animation-delay: 2s; opacity: .6; }

  @keyframes float {
    0%, 100% { transform: translateY(0); }
    50% { transform: translateY(-10px); }
  }

  /* ---------- Conteúdo ---------- */
  main {
    position: relative;
    z-index: 1;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 64px 16px;
    text-align: center;
  }

  .badge {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    padding: 8px 18px;
    border-radius: 999px;
    border: 1px solid rgba(255, 59, 59, 0.5);
    background: rgba(255, 59, 59, 0.1);
    color: #ff3b3b;
    font-size: 14px;
    font-weight: 800;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    margin-bottom: 28px;
  }
  .badge span {
    width: 8px; height: 8px;
    border-radius: 50%;
    background: #ff3b3b;
    box-shadow: 0 0 10px #ff3b3b;
    animation: pulse 1.4s ease-in-out infinite;
  }
  @keyframes pulse {
    0%, 100% { opacity: 1; }
    50% { opacity: .3; }
  }

  h1 {
    max-width: 820px;
    font-size: clamp(30px, 6.5vw, 58px);
    font-weight: 900;
    line-height: 1.08;
    letter-spacing: -0.02em;
    text-transform: uppercase;
    color: var(--green);
    text-shadow: 0 0 32px var(--green-glow);
  }
  h1 .white { color: var(--white); text-shadow: none; }

  .sub {
    margin-top: 20px;
    font-size: clamp(16px, 3.6vw, 22px);
    font-weight: 700;
    letter-spacing: 0.06em;
    text-transform: uppercase;
    color: var(--white);
  }
  .sub strong { color: var(--green); }

  /* ---------- Área do vídeo ---------- */
  .video {
    width: 100%;
    max-width: 860px;
    margin-top: 40px;
    background: #000;
  }
  /* retângulo de referência: some sozinho quando o embed for colado */
  .video:empty {
    aspect-ratio: 16 / 9;
    border-radius: 12px;
    box-shadow: 0 0 0 1px rgba(255,255,255,0.08), 0 20px 60px rgba(0,0,0,0.7);
  }

  @media (max-width: 480px) {
    main { padding: 48px 16px; }
    .video { margin-top: 32px; }
  }
